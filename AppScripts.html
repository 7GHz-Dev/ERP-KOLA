<script>
(function () {
  'use strict';

  var state = {
    token: sessionStorage.getItem('kolaSession') || '', user: null, jobs: [], masters: {}, users: [], dashboard: {},
    route: 'overview', pendingStage: 'bl', pendingSub: 'wait', masterType: 'shippers',
    selectedJobId: '', selectedDetail: null, modalSubmit: null, modalLocked: false, busy: false,
    intakeFile: null, intakeSource: 'AN', intakeBls: [{ shipperId: '', shipperName: '', blNo: '' }],
    intakeContainers: [{ containerNo: '', containerType: '', sealNo: '' }]
  };

  var STATUS_LABELS = {
    WAITING_ARRIVAL_NOTICE_BL: 'BL Waiting Confirm', WAITING_ENTER_BL: 'Waiting ENTER BL',
    WAITING_AN_APPROVAL: 'รอ NAMKANG อนุมัติ AN', AN_REJECTED: 'AN ไม่อนุมัติ',
    WAITING_INVOICE_DO: 'Waiting Invoice / DO', WAITING_FN_APPROVAL: 'รอ FAH อนุมัติ Final Invoice',
    FN_REJECTED: 'Final Invoice ไม่อนุมัติ', FN_APPROVED: 'Final Invoice อนุมัติแล้ว',
    DO_SENT: 'ส่ง DO ให้ Partner แล้ว', ENTRY_DRAFTED: 'Entry Drafted', CUSTOMS_FILED: 'Entry Filed',
    PORT_RELEASED: 'Port Released', RELEASED: 'Released'
  };
  var MASTER_LABELS = {
    shippers: 'Shipper', people: 'ผู้รับผิดชอบ', consignees: 'Consignee', notify: 'Notify Party',
    loadingTypes: 'Loading Type', ports: 'Port of Discharge', terminals: 'Port Terminal',
    jobTypes: 'Job Type', containerTypes: 'ขนาดตู้ / Container', packageTypes: 'หน่วยนับ / Package',
    settings: 'ค่าตั้งต้น', users: 'ผู้ใช้งาน'
  };

  document.addEventListener('DOMContentLoaded', init);

  function init() {
    if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    bindStaticEvents();
    if (state.token) loadApplication().catch(showLogin); else showLogin();
  }

  function bindStaticEvents() {
    byId('loginForm').addEventListener('submit', login);
    byId('logoutButton').addEventListener('click', logout);
    byId('passwordButton').addEventListener('click', function () { openPassword(false); });
    byId('refreshButton').addEventListener('click', refreshAll);
    byId('menuButton').addEventListener('click', function () { byId('appShell').classList.toggle('menu-open'); });
    byId('mainNav').addEventListener('click', function (event) {
      var button = event.target.closest('[data-route]');
      if (!button) return;
      state.route = button.dataset.route;
      byId('appShell').classList.remove('menu-open');
      renderNav(); renderRoute();
    });
    byId('routeContent').addEventListener('click', handleRouteClick);
    byId('routeContent').addEventListener('change', handleRouteChange);
    byId('routeContent').addEventListener('input', handleRouteInput);
    byId('routeContent').addEventListener('dblclick', handleRouteDoubleClick);
    byId('routeContent').addEventListener('submit', handleRouteSubmit);
    byId('drawerBackdrop').addEventListener('click', closeDrawer);
    byId('closeDrawerButton').addEventListener('click', closeDrawer);
    byId('drawerContent').addEventListener('click', handleDrawerClick);
    byId('closePreviewButton').addEventListener('click', closePreview);
    byId('closeModalButton').addEventListener('click', closeModal);
    byId('cancelModalButton').addEventListener('click', closeModal);
    byId('modalForm').addEventListener('submit', submitModal);
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') { if (!state.modalLocked) closeModal(); closePreview(); closeDrawer(); }
      if (byId('jobDrawer').classList.contains('open') && event.key === 'ArrowLeft') navigateDrawer(-1);
      if (byId('jobDrawer').classList.contains('open') && event.key === 'ArrowRight') navigateDrawer(1);
    });
  }

  async function login(event) {
    event.preventDefault(); var form = event.currentTarget; var error = byId('loginError');
    error.classList.add('hidden'); setFormBusy(form, true);
    try {
      var result = await rpc('authLogin', form.username.value, form.password.value);
      state.token = result.token; sessionStorage.setItem('kolaSession', state.token); form.reset(); await loadApplication();
    } catch (exception) { error.textContent = errorMessage(exception); error.classList.remove('hidden'); }
    finally { setFormBusy(form, false); }
  }

  async function logout() {
    try { await rpc('authLogout', state.token); } catch (ignore) {}
    state.token = ''; state.user = null; sessionStorage.removeItem('kolaSession'); showLogin();
  }

  async function loadApplication() {
    showLoading(); var data = await rpc('getBootstrapData', state.token); applyBootstrap(data); showApp();
    if (state.user.mustChangePassword) openPassword(true);
  }

  async function refreshAll(silent) {
    if (state.busy) return; state.busy = true; byId('refreshButton').disabled = true;
    try {
      // ดึงผลจาก Hub ก่อน แล้วค่อยโหลดข้อมูล จะได้เห็น Ref No./เลขใบขน ที่เพิ่งเสร็จทันที
      try { await rpc('syncHubResults', state.token); } catch (hubError) { console.warn('[hub]', hubError); }
      var data = await rpc('getBootstrapData', state.token); applyBootstrap(data);
      if (state.selectedJobId) await openDrawer(state.selectedJobId, true);
      if (!silent) toast('อัปเดตข้อมูลแล้ว', 'success');
    } catch (error) { handleError(error); }
    finally { state.busy = false; byId('refreshButton').disabled = false; }
  }

  function applyBootstrap(data) {
    state.user = data.user; state.jobs = data.jobs || []; state.masters = data.masters || {};
    state.users = data.users || []; state.dashboard = data.dashboard || {};
    if (!routeAllowed(state.route)) state.route = defaultRoute();
    byId('sidebarUserName').textContent = state.user.displayName;
    byId('sidebarUserRole').textContent = state.user.role;
    renderNav(); renderRoute();
  }

  function defaultRoute() {
    if (can('PAINT')) return 'paint-an';
    if (can('FAH')) return 'fah-do';
    if (can('NAMKANG')) return 'nam-approve';
    return 'overview';
  }
  function routeAllowed(route) {
    if (!state.user) return false;
    if (route === 'overview') return true;
    if (route === 'master') return can('ADMIN');
    if (route.indexOf('paint-') === 0) return can('PAINT');
    if (route.indexOf('fah-') === 0) return can('FAH');
    if (route.indexOf('nam-') === 0) return can('NAMKANG');
    return false;
  }
  function can(role) { return state.user && (state.user.role === 'ADMIN' || state.user.role === role); }

  function renderNav() {
    var groups = [
      { label: 'Overview', color: '#a4a097', roles: null, items: [['overview','Shipment Master']] },
      { label: 'PAINT', color: '#0075de', roles: ['PAINT'], items: [
        ['paint-an','Arrival Notice BL'], ['paint-bl','BL Waiting Confirm'], ['paint-pending','งานคงค้าง'],
        ['paint-eoffice','Upload E-Office']
      ]},
      { label: 'FAH', color: '#dd5b00', roles: ['FAH'], items: [
        ['fah-do','จัดการ Invoice DO'], ['fah-fn','อนุมัติ Final Invoice'], ['fah-draft','ตรวจ Draft / ทำใบขน']
      ]},
      { label: 'NAMKANG', color: '#1aae39', roles: ['NAMKANG'], items: [
        ['nam-approve','ตรวจรายการรออนุมัติ'], ['nam-cust','ข้อมูลลูกค้า / File'], ['nam-release','ตรวจ & ปล่อยสินค้า']
      ]},
      { label: 'SYSTEM', color: '#793400', roles: ['ADMIN'], items: [['master','Master Data']] }
    ];
    byId('mainNav').innerHTML = groups.filter(function (group) {
      return !group.roles || group.roles.some(can);
    }).map(function (group) {
      return '<div class="nav-group-title"><span class="nav-group-dot" style="background:' + group.color + '"></span>' + esc(group.label) + '</div>' +
        group.items.map(function (item) {
          return '<button class="nav-button ' + (state.route === item[0] ? 'active' : '') + '" data-route="' + item[0] + '">' +
            esc(item[1]) + navCount(item[0]) + '</button>';
        }).join('');
    }).join('');
  }

  function navCount(route) {
    var count = 0;
    if (route === 'nam-approve') count = state.jobs.filter(function (j) { return approvalStatus(j,'AN') === 'PENDING'; }).length;
    if (route === 'fah-fn') count = state.jobs.filter(function (j) { return approvalStatus(j,'FN') === 'PENDING'; }).length;
    if (route === 'fah-draft') count = state.jobs.filter(function (j) { return j.draftStatus === 'SUBMITTED'; }).length;
    if (route === 'paint-pending') count = state.jobs.filter(function (j) { return j.releaseStatus !== 'RELEASED'; }).length;
    return count ? '<span class="nav-count">' + count + '</span>' : '';
  }

  /**
   * ดึงผลจาก Hub เองเป็นระยะ
   *
   * ERP เป็นฝ่ายถาม Hub ไม่ใช่ Hub ยิงเข้ามา เพราะ Hub ไม่มี session token ของผู้ใช้
   * และการเปิดช่องให้ยิงเข้า ERP ได้จะกลายเป็นรูโหว่
   * ถามเฉพาะตอนมีงานค้างรอผลจริง ๆ และหยุดทันทีที่ออกจากหน้านี้
   */
  function jobsAwaitingHub(){
    return (state.jobs||[]).filter(function(j){
      var waitingDraft=j.draftTaskId&&!j.draftRefNo;
      var waitingCustoms=j.customsTaskId&&j.customsStatus!=='FILED';
      return waitingDraft||waitingCustoms;
    });
  }
  function stopHubPolling(){
    if(state.hubPollTimer){clearTimeout(state.hubPollTimer);state.hubPollTimer=null;}
  }
  function scheduleHubPolling(){
    stopHubPolling();
    if(state.hubPollDisabled)return;
    var waiting=jobsAwaitingHub();
    if(!waiting.length)return;
    state.hubPollTimer=setTimeout(async function(){
      state.hubPollTimer=null;
      if((state.route!=='paint-pending'&&state.route!=='fah-draft')||!state.token)return;
      try{
        var result=await rpc('syncHubResults',state.token);
        if(result&&result.configured===false){
          // ยังไม่ได้ตั้งค่า Hub ถามซ้ำไปก็เปลืองเปล่า
          state.hubPollDisabled=true;
          return;
        }
        if(result&&result.applied>0){
          var data=await rpc('getBootstrapData',state.token);
          applyBootstrap(data);
          toast('ได้ผลจาก Hub แล้ว '+result.applied+' รายการ','success');
          return state.route==='fah-draft'?renderFahDraft():renderPaintPending();
        }
      }catch(error){console.warn('[hub poll]',error);}
      scheduleHubPolling();
    },15000);
  }

  function routeRenderer(){
    var map = {
      overview: renderOverview, 'paint-an': function(){ renderIntake('AN'); }, 'paint-bl': function(){ renderIntake('BL'); },
      'paint-pending': renderPaintPending, 'paint-fn': renderFinalInvoicePage, 'paint-eoffice': renderEofficePage,
      'fah-do': renderFahDo, 'fah-fn': renderFahFn, 'fah-draft': renderFahDraft,
      'nam-approve': renderNamApprove, 'nam-cust': renderNamCustomer, 'nam-release': renderNamRelease,
      master: renderMaster
    };
    return map[state.route] || renderOverview;
  }

  function renderRoute() {
    closePreview();
    stopHubPolling();
    routeRenderer()();
  }

  /** วาดหน้าเดิมใหม่โดยไม่ปิดหน้าตัวอย่างเอกสารที่ผู้ใช้เปิดค้างไว้ ใช้ตอนค้นหา/เรียงลำดับ */
  function rerenderRoute() {
    stopHubPolling();
    routeRenderer()();
  }

  function setPage(title, subtitle) {
    byId('pageTitle').textContent = title; byId('pageSubtitle').textContent = subtitle || '';
  }
  function pageHead(role, title, subtitle) {
    return '<div class="page-head"><div><h2>' + (role ? '<span class="dept-tag ' + role.toLowerCase() + '">' + role + '</span>' : '') +
      esc(title) + '</h2><p>' + esc(subtitle || '') + '</p></div></div>';
  }

  function renderOverview() {
    setPage('Shipment Master', 'ฐานข้อมูลกลางทุกชุดงาน');
    var d = state.dashboard;
    var metrics = [['งานทั้งหมด',d.total||0,''],['Invoice เปลี่ยน',d.invoiceAlerts||0,'alert'],['รอ AN',d.waitingAN||0,'pending'],['รอ FN',d.waitingFN||0,'pending']];
    var rows = state.jobs.map(function (job) {
      return '<tr class="' + (job.hasInvoiceAlert?'invoice-alert':'') + '" data-open-job="' + attr(job.id) + '">' +
        '<td><strong class="job-link">' + esc(job.jobNo) + '</strong><span class="cell-sub">' + esc(job.sourceType||'AN') + '</span></td>' +
        '<td>' + esc(job.blNo||'-') + '</td><td>' + esc(masterName('shippers',job.shipperId)) + '</td>' +
        '<td>' + esc(job.vessel||'-') + '<span class="cell-sub">' + esc(job.voyage||'') + '</span></td>' +
        '<td>' + formatDate(job.eta) + '</td><td>' + statusBadge(job.status) + '</td><td>' + fileCount(job) + '</td></tr>';
    }).join('');
    byId('routeContent').innerHTML = pageHead('', 'Shipment Master', 'คลิกแถวเพื่อดู Job Detail, Container, Files และ Timeline') +
      '<div class="metrics mockup-metrics">' + metrics.map(function(m){return '<div class="metric '+m[2]+'"><span>'+esc(m[0])+'</span><strong>'+m[1]+'</strong></div>';}).join('') + '</div>' +
      tableHtml(['Job No.','BL No.','Shipper','Vessel / Voyage','ETA','สถานะ','Files'], rows, 'ยังไม่มี Job');
  }

  function renderIntake(sourceType) {
    state.intakeSource = sourceType; resetIntakeRows();
    setPage(sourceType === 'AN' ? 'Arrival Notice BL' : 'BL Waiting Confirm', 'อ่านข้อมูลจาก PDF และตรวจทานก่อนส่งเข้า Draft');
    byId('routeContent').innerHTML = pageHead('PAINT', sourceType === 'AN' ? 'จัดการ Arrival Notice BL' : 'BL Waiting Confirm',
      'อัปโหลด PDF → ระบบอ่านข้อมูลและเติมฟอร์ม → ตรวจสอบ → SENT TO DRAFT') +
      '<form id="intakeForm" class="card-panel intake-layout">' +
        '<input type="hidden" name="token" value="' + attr(state.token) + '"><input type="hidden" name="payloadJson" id="payloadJson">' +
        '<div class="section-title">อัปโหลด ' + (sourceType === 'AN' ? 'Arrival Notice' : 'Bill of Lading') + '</div>' +
        '<label class="drop-zone" id="arrivalDrop">ลากไฟล์ PDF จากอีเมลมาวาง หรือ <strong>เลือกไฟล์</strong> เพื่อดึงข้อมูลอัตโนมัติ' +
          '<input id="arrivalFile" name="fileBlob" type="file" accept="application/pdf,.pdf" hidden required></label>' +
        '<div id="readStatus" class="read-status">รองรับ Maersk · Evergreen · OOCL · ONE · Wan Hai · CNC · Namsung · Jinjiang</div>' +
        '<div class="section-title">ข้อมูลจาก ' + (sourceType === 'AN' ? 'Arrival Notice' : 'BL') + '</div>' +
        '<div class="extract-grid">' +
          extractField('JOB TYPE', selectHtml('jobTypeId', masterOptionsDefault('jobTypes','','MU'), 'an_jobtype')) +
          extractField('PRODUCT', inputHtml('product','an_product','text',false,'USED CAR')) +
          extractField('BL TYPE', '<select id="an_bltype" name="blType"><option>SWB</option><option>OBL</option><option>S</option><option>TWB</option><option>HBL</option><option>MBL</option><option>Original</option></select>') +
          extractField('SHIPLINE', inputHtml('shipline','an_shipline')) +
          extractField('SHIPPER / B/L', '<div id="blRows" class="repeat-list"></div><button class="button secondary small-add" type="button" data-action="add-bl">+ เพิ่ม BL</button>', true) +
          extractField('CONTAINER NO.', '<div id="containerRows" class="repeat-list"></div><button class="button secondary small-add" type="button" data-action="add-container">+ เพิ่มตู้</button>', true) +
          extractField('QUANTITY', '<div class="qty-pair">' + inputHtml('unitAmount','an_unit','number') + selectHtml('packageType', masterNameOptions('packageTypes','','UNIT'),'an_package') + '</div>') + extractField('WEIGHT (KG)', inputHtml('grossWeight','an_weight')) +
          extractField('VESSEL', inputHtml('vessel','an_vessel', 'text', true)) + extractField('VOYAGE', inputHtml('voyage','an_voyage')) +
          extractField('ETA', inputHtml('eta','an_eta','date')) +
          extractField('CONSIGNEE', selectHtml('consigneeId', masterOptionsDefault('consignees','','CNE0001'),'an_consignee')) +
          extractField('NOTIFY PARTY', selectHtml('notifyPartyId', masterOptionsDefault('notify','','NTP0001'),'an_notify')) +
          extractField('CLIENT IN CHARGE', selectHtml('personId', masterOptions('people',''),'an_person')) +
          extractField('PORT OF DISCHARGE', selectHtml('portId', masterOptionsDefault('ports','','THLCH'),'an_port')) +
          extractField('PORT TERMINAL', selectHtml('terminalId', masterOptions('terminals',''),'an_terminal')) +
          extractField('DEM FREE (วัน)', inputHtml('demDays','an_dem','number',false,settingValue('DEM_FREE_DAYS','5'))) + extractField('DET FREE (วัน)', inputHtml('detDays','an_det','number',false,settingValue('DET_FREE_DAYS','3'))) +
        '</div><div class="notice" style="margin-top:12px">CON = <b id="containerCount">0</b> ตู้ · BL = <b id="blCount">0</b> ฉบับ · SENT TO DRAFT 1 ครั้ง = Job No. ใหม่ 1 เลข</div>' +
        '<div class="form-actions"><button class="button primary" type="submit">SENT TO DRAFT</button><button class="button secondary" type="button" data-action="clear-intake">ล้างฟอร์ม</button></div>' +
      '</form>';
    renderRepeatRows(); bindDropZone();
  }

  function resetIntakeRows() {
    state.intakeFile = null; state.intakeBls = [{shipperId:'',shipperName:'',blNo:''}];
    state.intakeContainers = [{containerNo:'',containerType:'',sealNo:''}];
  }
  function renderRepeatRows() {
    var blBox = byId('blRows'), contBox = byId('containerRows'); if (!blBox || !contBox) return;
    blBox.innerHTML = state.intakeBls.map(function (row,index) {
      return '<div class="repeat-row" data-bl-row="' + index + '"><select class="bl-shipper">' + masterOptions('shippers',row.shipperId) +
        '</select><button class="icon-button add-master" type="button" data-action="quick-add-shipper" data-index="'+index+'" title="เพิ่ม Shipper ใหม่">+</button>' +
        '<input class="bl-number" value="' + attr(row.blNo) + '" placeholder="BILL OF LADING NO."><button class="icon-button" type="button" data-action="remove-bl" data-index="'+index+'">×</button></div>';
    }).join('');
    contBox.innerHTML = state.intakeContainers.map(function (row,index) {
      return '<div class="repeat-row container" data-container-row="'+index+'"><input class="container-number" value="'+attr(row.containerNo)+'" placeholder="CONTAINER NO.">' +
        '<select class="container-type">'+masterNameOptions('containerTypes',row.containerType,'40')+'</select><input class="container-seal" value="'+attr(row.sealNo)+'" placeholder="SEAL NO.">' +
        '<button class="icon-button" type="button" data-action="remove-container" data-index="'+index+'">×</button></div>';
    }).join(''); updateRepeatCounts();
  }
  function collectRepeatRows() {
    state.intakeBls = Array.prototype.map.call(document.querySelectorAll('[data-bl-row]'), function (row) {
      var select = row.querySelector('.bl-shipper'); var selected = select.options[select.selectedIndex];
      return { shipperId: select.value, shipperName: selected && select.value ? selected.textContent.replace(/^.*? · /,'') : '', blNo: row.querySelector('.bl-number').value.trim() };
    });
    state.intakeContainers = Array.prototype.map.call(document.querySelectorAll('[data-container-row]'), function (row) {
      return { containerNo: row.querySelector('.container-number').value.trim(), containerType: row.querySelector('.container-type').value.trim(), sealNo: row.querySelector('.container-seal').value.trim() };
    });
  }
  function updateRepeatCounts() {
    if (byId('blCount')) byId('blCount').textContent = document.querySelectorAll('.bl-number').length;
    if (byId('containerCount')) byId('containerCount').textContent = Array.prototype.filter.call(document.querySelectorAll('.container-number'),function(x){return x.value.trim();}).length;
  }
  function bindDropZone() {
    var zone = byId('arrivalDrop'); if (!zone) return;
    zone.addEventListener('dragover',function(e){e.preventDefault();zone.classList.add('dragging');});
    zone.addEventListener('dragleave',function(){zone.classList.remove('dragging');});
    zone.addEventListener('drop',function(e){e.preventDefault();zone.classList.remove('dragging');if(e.dataTransfer.files[0]){var input=byId('arrivalFile');try{var dt=new DataTransfer();dt.items.add(e.dataTransfer.files[0]);input.files=dt.files;}catch(ignore){}readArrival(e.dataTransfer.files[0]);}});
  }

  async function readArrival(file) {
    if (!file) return; var status = byId('readStatus'); state.intakeFile = file;
    if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') { setReadStatus('กรุณาเลือกไฟล์ PDF เท่านั้น','error'); return; }
    if (!window.pdfjsLib) { setReadStatus('โหลดตัวอ่าน PDF ไม่ได้ กรุณาตรวจอินเทอร์เน็ต','error'); return; }
    setReadStatus('กำลังอ่านไฟล์ ' + file.name + ' ...','');
    try {
      var buffer = await file.arrayBuffer(); var pdf = await pdfjsLib.getDocument({data:buffer.slice(0)}).promise;
      await renderPdfDocument(pdf, 'ตัวอย่าง ' + (state.intakeSource === 'AN' ? 'Arrival Notice' : 'Bill of Lading'));
      var lines = [];
      for (var pageNo=1; pageNo<=pdf.numPages; pageNo+=1) lines = lines.concat(await pdfPageLines(await pdf.getPage(pageNo)));
      if (!lines.length) { setReadStatus('อ่านข้อความไม่ได้: เป็นไฟล์สแกน/รูปภาพ ต้องใช้ OCR','error'); return; }
      var extracted = extractBL(lines); fillExtracted(extracted, lines);
      setReadStatus('อ่านสำเร็จ · ' + (extracted.shipline || extracted.carrier || 'กฎทั่วไป') + ' · กรุณาตรวจสอบก่อนบันทึก','ok');
      toast('ดึงข้อมูลจาก PDF สำเร็จ', 'success');
    } catch (error) { setReadStatus('อ่านไฟล์ไม่สำเร็จ: ' + error.message,'error'); }
  }
  async function pdfPageLines(page) {
    var content = await page.getTextContent(); var rows = {};
    content.items.forEach(function(item){if(!item.str||!item.str.trim())return;var y=Math.round(item.transform[5]);(rows[y]=rows[y]||[]).push({x:item.transform[4],s:item.str});});
    return Object.keys(rows).map(Number).sort(function(a,b){return b-a;}).map(function(y){return rows[y].sort(function(a,b){return a.x-b.x;}).map(function(x){return x.s;}).join(' ').replace(/\s+/g,' ').trim();}).filter(Boolean);
  }
  function setReadStatus(message,type) { var el=byId('readStatus');if(el){el.textContent=message;el.className='read-status '+(type||'');} }

  function extractBL(rawLines) {
    var lines=rawLines.filter(Boolean).map(function(l){return l.replace(/\s+/g,' ').trim();}); var T=lines.join('\n'),U=T.toUpperCase();
    var r={product:'',bl_type:'',shipper:'',bl:'',containers:'',unit:'',weight:'',shipline:'',vessel:'',voyage:'',consignee:'',notify:'',carrier:''};
    var m1=function(re,s){var m=String(s===undefined?T:s).match(re);return m?(m[1]!=null?m[1]:m[0]).trim():'';};
    var index=function(re){return lines.findIndex(function(l){return re.test(l);});};
    var next=function(re){var i=index(re);return i>=0&&i+1<lines.length?lines[i+1]:'';};
    var previous=function(re){var i=index(re);return i>0?lines[i-1]:'';};
    var clean=function(s){return String(s||'').replace(/\s+(TEL|FAX|E-?MAIL|ATTN|TAX|PH|BERTH)\b.*$/i,'').replace(/\s{2,}/g,' ').trim();};
    var company=function(s){var m=String(s||'').match(/^(.*?(?:CO\.,?\s?LTD\.?|LIMITED|L\.?L\.?C|LLC|CORPORATION|INC\.?|COMPANY))\b\.?/i);return clean(m?m[1]:s);};
    var splitVessel=function(s){s=clean(s);var m=s.match(/^(.*\S)\s+([A-Z]?\d{2,4}[A-Z]?|\d[\dA-Z\-\/]*[A-Z0-9])$/);return m?[m[1].trim(),m[2].trim()]:[s,''];};
    var fmt=function(s){var n=parseFloat(String(s||'').replace(/,/g,''));return isNaN(n)?String(s||''):n.toLocaleString('en-US',{maximumFractionDigits:3});};
    var party=function(name){var line=lines.find(function(l){return l.toUpperCase().indexOf(name)>=0;});return line?company(line.substring(line.toUpperCase().indexOf(name))):'';};
    var product=function(){return m1(/\b(USED\s+(?:VEHICLES?|CARS?)|OTHER\s+VEHICLES?[^\n]*)/i).toUpperCase();};
    var carrier=/MAERSK|\bMAEU\b/.test(U)?'MAERSK':/EVERGREEN|\bEGLV/.test(U)?'EVERGREEN':/JINJIANG|JJSHIPPING|\bJJ[A-Z]{4}/.test(U)?'JINJIANG':/NAMSUNG|NSSL/.test(U)?'NAMSUNG':/CMA\s*CGM|\bCNC\b/.test(U)?'CNC':/\bOOCL\b|\bOOLU/.test(U)?'OOCL':/OCEAN NETWORK EXPRESS|ONE-?LINE|\bONEY/.test(U)?'ONE':/WAN\s*HAI|\bWHSU|\bWHLC/.test(U)?'WANHAI':'GENERIC';
    r.carrier=carrier;r.shipline={MAERSK:'MAERSK',EVERGREEN:'EVERGREEN',JINJIANG:'SHANGHAI JINJIANG',NAMSUNG:'NAMSUNG',CNC:'CNC LINE (CMA CGM)',OOCL:'OOCL',ONE:'ONE (OCEAN NETWORK EXPRESS)',WANHAI:'WAN HAI',GENERIC:''}[carrier];
    var seen={};r.containers=(T.match(/\b[A-Z]{4}\s?\d{7}\b/g)||[]).map(function(c){return c.replace(/\s/g,'');}).filter(function(c){if(seen[c])return false;seen[c]=true;return true;}).join(',');
    r.consignee=party('MAESOT FREEZONE');r.notify=party('KOLA SHIPPING');r.bl_type=/SEA\s*WAY\s*BILL|SEAWAYBILL|WAY\s*BILL/i.test(U)?'SWB':(/NEGOTIABLE/i.test(U)&&!/NON-?NEGOTIABLE/i.test(U)?'OBL':'');
    if(carrier==='MAERSK'){r.bl='MAEU'+(m1(/MAEU\s?(\d{9})/)||'');var mm=T.match(/VESSEL\s+(.+?)\s+(\d{2,4}[NSEW])\s+ETA/i);if(mm){r.vessel=mm[1].trim();r.voyage=mm[2];}var cn=next(/Consignee.*Shipper/i);mm=cn.match(/(?:CO\.,?\s?LTD\.?|LIMITED|LLC|CORPORATION|INC\.?)\.?\s+(.+)$/i);if(mm)r.shipper=company(mm[1]);r.weight=fmt(m1(/([\d,]+\.\d+)\s*KGS\s+[\d.]+\s*CBM/i));r.unit=m1(/(\d+)\s*UNITS?\b/i);}
    else if(carrier==='EVERGREEN'){r.bl=m1(/B\/L\s*NO\s*:\s*([A-Z]{4}\d{6,})/i);var ev=splitVessel(m1(/VSL\/VOY\s*:\s*(.+)/i));r.vessel=ev[0];r.voyage=ev[1];r.shipper=company(m1(/Shipper\s*:\s*(.+)/i));r.product=clean(m1(/Description\s*:\s*(.+)/i));var em=T.match(/[A-Z]{4}\d{7}\s+.+?\s+(\d+)\s*\/\s*UNT\s+([\d,]+\.\d+)/i);if(em){r.unit=em[1];r.weight=fmt(em[2]);}}
    else if(carrier==='JINJIANG'){var jr=lines.find(function(l){return /\bJJ[A-Z0-9]{6,}\b/.test(l);})||'';var jm=jr.match(/^(.+?)\s+(JJ[A-Z0-9]{6,})\s*$/);if(jm){r.shipper=company(jm[1]);r.bl=jm[2];}else r.bl=m1(/\b(JJ[A-Z0-9]{6,})\b/);var jv=lines.find(function(l){return /\b\d{3,4}[NSEW]\b/.test(l)&&!/MAESOT|KOLA/i.test(l);})||'';jm=jv.match(/([A-Z][A-Z ]+?)\s+(\d{3,4}[NSEW])\b/);if(jm){r.vessel=jm[1].trim();r.voyage=jm[2];}r.weight=fmt(m1(/G\.?W\.?\s*([\d,]+\.\d+)/i));r.product=product()||'USED CAR';}
    else if(carrier==='NAMSUNG'){r.bl=m1(/\b(NSSL[A-Z0-9]{6,})\b/);var ni=index(/\bNSSL[A-Z0-9]{6,}\b/);if(ni>0)r.shipper=company(lines[ni-1]);var nv=lines.find(function(l){return /\d{3,4}[NSEW]\b/.test(l)&&!/MAESOT|KOLA/i.test(l);})||'';var nm=nv.match(/([A-Z][A-Z ]+?)\s+(\d{3,4}[NSEW])\b/);if(nm){r.vessel=nm[1].trim();r.voyage=nm[2];}}
    else if(carrier==='CNC'){var cv=splitVessel(previous(/VESSEL\s*\/\s*VOY/i).replace(/\s+\d{1,2}-[A-Z]{3}-\d{2}.*$/i,''));r.vessel=cv[0];r.voyage=cv[1];r.bl=m1(/^([A-Z]{2,}\d{4,})\b/,previous(/B\/L-?NO/i));r.shipper=company(previous(/^SHIPPER:/i));if(!r.bl_type)r.bl_type='OBL';}
    else if(carrier==='OOCL'){r.bl=m1(/\b(OOLU\d{7,})\b/);var vi=index(/B\/L\s*Vessel\/Voyage/i);for(var j=vi+1;j<Math.min(lines.length,vi+8);j+=1){if(/[A-Za-z]{3,}.*\s+\d{2,4}[A-Z]?$/.test(lines[j])){var ov=splitVessel(lines[j]);r.vessel=ov[0];r.voyage=ov[1];break;}}var ol=lines.find(function(l){return /MAESOT FREEZONE/i.test(l);})||'';var before=ol.substring(0,ol.toUpperCase().indexOf('MAESOT')).trim();if(/AUTOMOBILES|TRADING|CO\.|LTD|LIMITED|CORPORATION|COMPANY|LLC/i.test(before))r.shipper=company(before);var om=T.match(/Total:\s*(\d+)\s+([\d,]+)\s*KG/i);if(om){r.unit=om[1];r.weight=fmt(om[2]);}}
    else if(carrier==='ONE'){r.bl=m1(/B\/L\s*No\.?\s*([A-Z]{2,}\d{4,})/i)||m1(/\b(ONEY[A-Z0-9]{8,})\b/);r.vessel=clean(previous(/^VESSEL\s*:/i));r.voyage=m1(/VOYAGE\s*:\s*([A-Z0-9\-]+)/i);var oneLine=lines.find(function(l){return /CORPORATION|CO\.,?\s?LTD|LIMITED|LLC|INC|COMPANY/i.test(l)&&new RegExp(r.vessel.replace(/[^A-Z0-9 ]/gi,''),'i').test(l);})||'';var oneMatch=oneLine.match(/^(.+?(?:CORPORATION|CO\.,?\s?LTD\.?|LIMITED|LLC|INC\.?|COMPANY))\b/i);if(oneMatch)r.shipper=company(oneMatch[1]);}
    else if(carrier==='WANHAI'){r.bl=m1(/B\/L\s*No:?\s*([A-Z0-9]+)/i);var wm=T.match(/\b(WAN\s*HAI\s*\d+)\s+([A-Z]?\d{2,4}[A-Z]?)\b/i);if(wm){r.vessel=clean(wm[1]);r.voyage=wm[2];}var bi=index(/B\/L\s*No:/i);for(var wi=Math.max(0,bi);wi<lines.length;wi+=1){if(/(CO\.,?\s?LTD\.?|LIMITED|LLC|CORPORATION|INC\.?)/i.test(lines[wi])&&!/WAN\s*HAI|MAESOT FREEZONE|KOLA SHIPPING/i.test(lines[wi])){r.shipper=company(lines[wi]);break;}}}
    else {r.bl=m1(/B[\/.]?L\s*(?:No\.?|Number|NO)?\s*[:#]?\s*([A-Z]{2,}\d{5,}|[A-Z0-9]{8,})/i);var vv=splitVessel(next(/Vessel/i)||previous(/Vessel/i));r.vessel=vv[0];r.voyage=vv[1];}
    if(!r.shipper)r.shipper=company(next(/Shipper/i)||previous(/Shipper/i));
    if(!r.weight)r.weight=fmt(m1(/([\d,]+\.\d{2,})\s*KG[SM]?\b/i)||m1(/([\d,]+)\s*KG[SM]?\b/i));
    if(!r.unit)r.unit=m1(/(\d+)\s*(?:UNIT|UNT|UN\b|PKG|PACKAGE)/i);
    if(!r.product)r.product=product(); return r;
  }

  function fillExtracted(result, lines) {
    setValue('an_product',result.product);setValue('an_bltype',result.bl_type);setValue('an_unit',result.unit);setValue('an_weight',result.weight);
    setValue('an_shipline',result.shipline);setValue('an_vessel',result.vessel);setValue('an_voyage',result.voyage);
    setMasterSelect('an_consignee','consignees',result.consignee);setMasterSelect('an_notify','notify',result.notify);
    var eta=extractEta(lines);if(eta)setValue('an_eta',eta);
    collectRepeatRows(); var shipperId=masterIdByName('shippers',result.shipper);
    if(state.intakeBls.length===1&&!state.intakeBls[0].blNo) state.intakeBls[0]={shipperId:shipperId,shipperName:result.shipper,blNo:result.bl};
    else state.intakeBls.push({shipperId:shipperId,shipperName:result.shipper,blNo:result.bl});
    String(result.containers||'').split(',').filter(Boolean).forEach(function(c){
      if(state.intakeContainers.length===1&&!state.intakeContainers[0].containerNo)state.intakeContainers[0]={containerNo:c,containerType:'',sealNo:''};
      else if(!state.intakeContainers.some(function(x){return x.containerNo===c;}))state.intakeContainers.push({containerNo:c,containerType:'',sealNo:''});
    }); renderRepeatRows();
  }
  function extractEta(lines) { var m=lines.join(' ').match(/E\.?T\.?A\.?\b[^0-9]{0,15}(\d{1,2}[\/\-.][A-Za-z0-9]{2,9}[\/\-.]\d{2,4}|\d{4}-\d{2}-\d{2})/i);return m?toIsoDate(m[1]):''; }
  function toIsoDate(value) {if(/^\d{4}-\d{2}-\d{2}$/.test(value))return value;var mon={JAN:'01',FEB:'02',MAR:'03',APR:'04',MAY:'05',JUN:'06',JUL:'07',AUG:'08',SEP:'09',OCT:'10',NOV:'11',DEC:'12'};var m=value.match(/^(\d{1,2})[\/\-\.\s]([A-Za-z]{3})[A-Za-z]*[\/\-\.\s](\d{2,4})$/);if(m)return (m[3].length===2?'20':'')+m[3]+'-'+mon[m[2].toUpperCase()]+'-'+String(m[1]).padStart(2,'0');m=value.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);return m?((m[3].length===2?'20':'')+m[3]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0')):'';}

  // ---- ตารางงานคงค้าง: ค้นหารายคอลัมน์ + คลิกหัวคอลัมน์เพื่อสลับการเรียงลำดับ ----
  function tableCell(text,html){return {text:String(text===undefined||text===null?'':text),html:html===undefined?null:html};}

  function tableCompare(a,b){
    if(typeof a==='number'&&typeof b==='number')return a-b;
    var x=String(a),y=String(b);
    var nx=Number(x),ny=Number(y);
    if(x!==''&&y!==''&&!isNaN(nx)&&!isNaN(ny))return nx-ny;
    return x.localeCompare(y,'th');
  }

  /**
   * ตารางกลางที่ค้นหารายคอลัมน์และคลิกหัวคอลัมน์เพื่อเรียงลำดับได้
   * ทุกหน้าที่แสดงรายการงานใช้ตัวนี้ร่วมกัน สถานะการค้นหา/เรียง แยกเก็บตาม tableKey
   */
  function dataTableHtml(tableKey,columns,rows,sort,filters,emptyText){
    var head='<tr><th class="col-no">No.</th>'+columns.map(function(c,i){
      var arrow=sort&&sort.index===i?(sort.dir==='asc'?' ▲':' ▼'):'';
      return '<th class="sortable" data-action="table-sort" data-table="'+attr(tableKey)+'" data-index="'+i+'" title="คลิกเพื่อเรียงลำดับ">'+esc(c.label)+arrow+'</th>';
    }).join('')+'</tr>';
    var filterRow='<tr class="filter-row"><th></th>'+columns.map(function(c,i){
      return c.plain?'<th></th>':'<th><input type="search" class="col-filter" data-table="'+attr(tableKey)+'" data-filter-col="'+i+'" value="'+attr(filters[tableKey+'|'+i]||'')+'" placeholder="ค้นหา"></th>';
    }).join('')+'</tr>';
    var body=rows.length?rows.map(function(r,index){
      return '<tr class="'+(r.job&&r.job.hasInvoiceAlert?'invoice-alert':'')+'"'+(r.job?' data-open-job="'+attr(r.job.id)+'"':'')+'><td>'+(index+1)+'</td>'+
        r.cells.map(function(c){return '<td>'+(c.html===null?esc(c.text):c.html)+'</td>';}).join('')+'</tr>';
    }).join(''):'<tr><td colspan="'+(columns.length+1)+'" class="empty-state">'+esc(emptyText||'ไม่มีรายการ')+'</td></tr>';
    return '<div class="table-wrap"><table class="data-table queue-table pending-table"><thead>'+head+filterRow+'</thead><tbody>'+body+'</tbody></table></div>';
  }

  /** กรอง เรียง แล้วคืน HTML ของตารางในคราวเดียว */
  function renderDataTable(tableKey,columns,list,emptyText){
    state.tableFilters=state.tableFilters||{};
    state.tableSort=state.tableSort||{};
    var filters=state.tableFilters,sort=state.tableSort[tableKey];

    var rows=list.map(function(j){return {job:j,cells:columns.map(function(c){return c.get(j);})};});
    rows=rows.filter(function(r){
      return columns.every(function(c,i){
        var needle=String(filters[tableKey+'|'+i]||'').trim().toLowerCase();
        return !needle||r.cells[i].text.toLowerCase().indexOf(needle)>=0;
      });
    });
    if(sort&&columns[sort.index]){
      var column=columns[sort.index];
      rows.sort(function(a,b){
        var x=column.sortKey?column.sortKey(a.job):a.cells[sort.index].text;
        var y=column.sortKey?column.sortKey(b.job):b.cells[sort.index].text;
        var result=tableCompare(x,y);
        return sort.dir==='desc'?-result:result;
      });
    }
    return dataTableHtml(tableKey,columns,rows,sort,filters,emptyText);
  }

  /** คืนโฟกัสให้ช่องค้นหาที่กำลังพิมพ์ เพราะการ re-render สร้าง input ใหม่ทั้งหมด */
  function restoreTableFocus(){
    if(!state.tableFocus)return;
    var parts=String(state.tableFocus).split('|');
    var active=document.querySelector('[data-table="'+parts[0]+'"][data-filter-col="'+parts[1]+'"]');
    if(active){active.focus();try{active.setSelectionRange(active.value.length,active.value.length);}catch(ignore){}}
  }

  function renderPaintPending() {

  function base64ToBytes(base64){var binary=atob(base64),bytes=new Uint8Array(binary.length);for(var i=0;i<binary.length;i+=1)bytes[i]=binary.charCodeAt(i);return bytes;}
  function bytesToBase64(bytes){var chunk=0x8000,parts=[];for(var i=0;i<bytes.length;i+=chunk)parts.push(String.fromCharCode.apply(null,bytes.subarray(i,i+chunk)));return btoa(parts.join(''));}

  /**
   * รวมชุด E-Office
   *
   * ฝั่งเซิร์ฟเวอร์แปลงทุกชิ้นเป็น PDF ให้แล้ว (รวมถึงดึงเฉพาะขอบเขตการพิมพ์ของ Final Invoice ที่เป็น Excel)
   * ส่วนการต่อไฟล์ทำที่นี่เพราะ Apps Script ไม่มี API รวม PDF
   */
  async function mergeEofficeBundle(jobId){
    if(typeof PDFLib==='undefined')return toast('โหลดตัวรวมไฟล์ไม่สำเร็จ กรุณารีเฟรชหน้าเว็บ','error');
    var job=findJob(jobId); if(!job)return;
    toast('กำลังเตรียมไฟล์...','');
    try{
      var bundle=await rpc('getEofficeBundle',state.token,jobId);
      if(!bundle.parts.length)return toast('ไม่มีไฟล์ให้รวมเลย','error');

      var merged=await PDFLib.PDFDocument.create();
      for(var i=0;i<bundle.parts.length;i+=1){
        var source=await PDFLib.PDFDocument.load(base64ToBytes(bundle.parts[i].base64));
        var pages=await merged.copyPages(source,source.getPageIndices());
        pages.forEach(function(page){merged.addPage(page);});
      }
      var bytes=await merged.save();

      // เก็บกลับเข้า Drive ของงาน แล้วค่อยเปิดดู
      await rpc('saveEofficeBundle',state.token,jobId,bytesToBase64(bytes));
      await showBundlePreview(bytes,bundle);
      if(bundle.missing.length)toast('รวมแล้ว แต่ขาด: '+bundle.missing.join(', '),'error');
      else toast('รวมชุด E-Office แล้ว ('+bundle.parts.length+' ไฟล์)','success');
      await refreshAll(true);
    }catch(error){handleError(error);}
  }

  /** เปิดชุดที่เคยรวมไว้แล้วจาก Drive ไม่ต้องรวมใหม่ทุกครั้งที่อยากพิมพ์ */
  async function printStoredBundle(fileId){
    try{
      toast('กำลังเปิดไฟล์ชุด...','');
      var result=await rpc('downloadJobFile',state.token,fileId);
      await showBundlePreview(base64ToBytes(result.base64),{suggestedName:result.fileName,parts:[]});
    }catch(error){handleError(error);}
  }
  /**
   * แสดงชุดที่รวมแล้ว
   *
   * เดิมใช้ iframe ชี้ไป blob: URL แต่ Apps Script เสิร์ฟหน้าเว็บอยู่ใน iframe ที่ถูก sandbox
   * Chrome จึงบล็อก blob: ที่ซ้อนเข้าไปอีกชั้น ("หน้านี้ถูกบล็อกโดย Chrome")
   * จึงเปลี่ยนมาเรนเดอร์ทุกหน้าเป็น canvas ด้วย pdf.js แทน ซึ่งเป็น DOM ธรรมดา ไม่ติด sandbox
   * และสั่งพิมพ์ได้ตรง ๆ ด้วย @media print
   */
  async function showBundlePreview(bytes,bundle){
    var partLabels=(bundle.parts||[]).map(function(p){return p.label;}).join(' + ');
    var title=bundle.suggestedName+(partLabels?' · '+partLabels:'');
    var pdf=await pdfjsLib.getDocument({data:bytes}).promise;
    await renderPdfDocument(pdf,title,true);
    var printButton=byId('printPreviewButton');
    printButton.classList.remove('hidden');
    printButton.onclick=function(){window.print();};
  }

  function openModal(config){state.modalSubmit=config.onSubmit;state.modalLocked=Boolean(config.locked);byId('modalTitle').textContent=config.title||'บันทึกข้อมูล';byId('modalBody').innerHTML=config.body||'';byId('submitModalButton').textContent=config.submitLabel||'บันทึก';byId('submitModalButton').className='button '+(config.submitClass||'primary');byId('closeModalButton').classList.toggle('hidden',state.modalLocked);byId('cancelModalButton').classList.toggle('hidden',state.modalLocked);byId('modalBackdrop').classList.remove('hidden');}

  async function submitModal(event){event.preventDefault();if(!state.modalSubmit||state.busy)return;var form=event.currentTarget,data=formObject(form);state.busy=true;setFormBusy(form,true);try{await state.modalSubmit(data,form);}catch(error){handleError(error);}finally{state.busy=false;setFormBusy(form,false);}}

  async function afterMutation(message,jobId){var selected=jobId||state.selectedJobId;var data=await rpc('getBootstrapData',state.token);applyBootstrap(data);toast(message,'success');if(selected)await openDrawer(selected,true);}
  function rpc(name){var args=Array.prototype.slice.call(arguments,1);return new Promise(function(resolve,reject){var runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);runner[name].apply(runner,args);});}
  function uploadFormRpc(name,form){return new Promise(function(resolve,reject){var runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);runner[name](form);});}
  function handleError(error){var raw=String(error&&error.message?error.message:error||'เกิดข้อผิดพลาด');if(/UNAUTHENTICATED|SESSION_EXPIRED|ACCOUNT_DISABLED/.test(raw)){state.token='';sessionStorage.removeItem('kolaSession');showLogin();}toast(errorMessage(error),'error');}
  function errorMessage(error){var raw=String(error&&error.message?error.message:error||'เกิดข้อผิดพลาด'),i=raw.indexOf('|');return (i>=0?raw.slice(i+1):raw.replace(/^Exception:\s*/,''));}

  function statusBadge(status){var cls=/REJECTED/.test(status)?'rejected':/WAITING|DRAFTED/.test(status)?'pending':/APPROVED|FILED|RELEASED|SENT/.test(status)?'approved':'';return '<span class="badge '+cls+'">'+esc(statusLabel(status))+'</span>';}

  function invoiceAlertCell(job){var f=job.currentFiles&&job.currentFiles.INVOICE_GOODS;if(!f)return '<span class="badge pending">รอ NAMKANG</span>';if(job.hasInvoiceAlert)return '<span class="badge rejected">เปลี่ยนใหม่</span> <button class="button tiny secondary" data-action="preview-file" data-id="'+f.id+'">Review</button> <button class="button tiny namkang" data-action="ack" data-id="'+f.id+'">รับทราบ</button>';return '<span class="badge approved">'+esc(f.fileName)+'</span>';}

  function inputField(label,name,type,value,required){return '<label class="field"><span>'+esc(label)+'</span><input name="'+attr(name)+'" type="'+(type||'text')+'" value="'+attr(value||'')+'"'+(required?' required':'')+'></label>';}

  function setFormBusy(form,busy){form.setAttribute('aria-busy',busy?'true':'false');Array.prototype.forEach.call(form.querySelectorAll('button'),function(b){b.disabled=busy;});}
  function formatDate(value){if(!value)return '-';var d=new Date(value);return isNaN(d)?String(value):new Intl.DateTimeFormat('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d);}
  function formatDateTime(value){if(!value)return '-';var d=new Date(value);return isNaN(d)?String(value):new Intl.DateTimeFormat('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(d);}
  function addDays(iso,days){if(!iso)return '';var d=new Date(iso);if(isNaN(d.getTime()))return '';d.setDate(d.getDate()+(Number(days)||0));return d.toISOString().slice(0,10);}
  function dateValue(value){if(!value)return '';var d=new Date(value);return isNaN(d)?String(value).slice(0,10):d.toISOString().slice(0,10);}
  function normalize(value){return String(value||'').toLowerCase().replace(/[^a-z0-9\u0E00-\u0E7F]/g,'');}
  function asBool(value){return value===true||value==='true'||value===1||value==='1';}
  function byId(id){return document.getElementById(id);}
  function esc(value){return String(value===undefined||value===null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function attr(value){return esc(value);}
}());

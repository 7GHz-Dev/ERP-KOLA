<style>
  :root {
    --navy: #183247;
    --navy-2: #24465f;
    --ink: #1d2935;
    --muted: #697784;
    --line: #d8e0e6;
    --surface: #ffffff;
    --canvas: #f2f5f7;
    --blue: #1870a7;
    --blue-soft: #eaf4fa;
    --green: #277a55;
    --green-soft: #e9f5ee;
    --amber: #9a6500;
    --amber-soft: #fff4d6;
    --red: #b22f38;
    --red-soft: #fff0f1;
    --shadow: 0 14px 36px rgba(21, 44, 60, .16);
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    color: var(--ink);
    background: var(--canvas);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--canvas); }
  body { min-height: 100vh; font-size: 14px; }
  button, input, select, textarea { font: inherit; letter-spacing: 0; }
  button { cursor: pointer; }
  .hidden { display: none !important; }

  .loading-screen {
    position: fixed; inset: 0; z-index: 1000; display: grid; place-content: center;
    gap: 22px; background: var(--surface);
  }
  .brand-mark {
    width: 56px; height: 56px; display: grid; place-items: center; color: #fff;
    background: var(--navy); border-radius: 6px; font-size: 28px; font-weight: 800;
  }
  .brand-mark.small { width: 36px; height: 36px; font-size: 19px; }
  .loading-line { width: 150px; height: 3px; overflow: hidden; background: #e7edf1; }
  .loading-line span { display: block; width: 45%; height: 100%; background: #df4c42; animation: load 1s infinite ease-in-out; }
  @keyframes load { from { transform: translateX(-110%); } to { transform: translateX(330%); } }

  .login-view {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--navy);
  }
  .login-panel {
    width: min(420px, 100%); padding: 34px; background: var(--surface);
    border-top: 4px solid #df4c42; box-shadow: var(--shadow);
  }
  .login-brand { display: flex; align-items: center; gap: 16px; margin-bottom: 30px; }
  .login-brand h1 { margin: 0; font-size: 22px; letter-spacing: 0; }
  .login-brand p { margin: 4px 0 0; color: var(--muted); }
  .version { margin: 22px 0 0; text-align: center; color: #8b969f; font-size: 12px; }

  .form-stack { display: grid; gap: 17px; }
  .field { display: grid; gap: 7px; color: #41515e; font-weight: 600; }
  .field small { color: var(--muted); font-weight: 400; }
  input, select, textarea {
    width: 100%; min-height: 40px; border: 1px solid #bdc9d2; border-radius: 4px;
    padding: 9px 11px; color: var(--ink); background: #fff; outline: none;
  }
  textarea { min-height: 84px; resize: vertical; }
  input:focus, select:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(24,112,167,.12); }
  .form-error { margin: -4px 0 0; color: var(--red); font-size: 13px; }

  .button {
    min-height: 38px; border: 1px solid transparent; border-radius: 4px; padding: 8px 14px;
    font-weight: 650; white-space: nowrap;
  }
  .button.primary { color: #fff; background: var(--blue); border-color: var(--blue); }
  .button.primary:hover { background: #125e8d; }
  .button.secondary { color: var(--ink); background: #fff; border-color: #bfcbd4; }
  .button.ghost { color: #536574; background: transparent; border-color: transparent; }
  .button.danger { color: #fff; background: var(--red); border-color: var(--red); }
  .button.success { color: #fff; background: var(--green); border-color: var(--green); }
  .button.compact { min-height: 34px; padding: 6px 10px; font-size: 13px; }
  .button.full { width: 100%; }
  .button:disabled { opacity: .55; cursor: wait; }
  .icon-button {
    width: 36px; height: 36px; display: grid; place-items: center; padding: 0;
    border: 1px solid transparent; border-radius: 4px; color: #455866; background: transparent;
    font-size: 20px;
  }
  .icon-button:hover { background: #e9eef2; }

  .app-shell { min-height: 100vh; display: grid; grid-template-columns: 228px minmax(0, 1fr); }
  .sidebar {
    position: fixed; inset: 0 auto 0 0; z-index: 30; width: 228px; display: flex;
    flex-direction: column; background: var(--navy); color: #fff;
  }
  .sidebar-brand { height: 72px; display: flex; align-items: center; gap: 12px; padding: 0 18px; border-bottom: 1px solid rgba(255,255,255,.12); }
  .sidebar-brand strong { display: block; font-size: 15px; }
  .sidebar-brand span { display: block; margin-top: 3px; color: #b8c7d1; font-size: 11px; }
  .main-nav { display: grid; gap: 4px; padding: 18px 10px; }
  .nav-button {
    width: 100%; min-height: 42px; border: 0; border-radius: 4px; padding: 0 12px;
    color: #d7e2e9; background: transparent; text-align: left; font-weight: 600;
  }
  .nav-button:hover { background: rgba(255,255,255,.08); }
  .nav-button.active { color: #fff; background: var(--navy-2); border-left: 3px solid #f0b84b; }
  .sidebar-user { margin-top: auto; padding: 16px 18px; border-top: 1px solid rgba(255,255,255,.12); }
  .sidebar-user span, .sidebar-user small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sidebar-user small { margin-top: 4px; color: #b8c7d1; }

  .app-body { grid-column: 2; min-width: 0; }
  .topbar {
    position: sticky; top: 0; z-index: 20; height: 72px; display: flex; align-items: center;
    gap: 14px; padding: 0 24px; background: #fff; border-bottom: 1px solid var(--line);
  }
  .topbar h1 { margin: 0; font-size: 19px; letter-spacing: 0; }
  .topbar p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
  .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 7px; }
  .menu-button { display: none; }

  .content { padding: 22px 24px 40px; }
  .metrics { display: grid; grid-template-columns: repeat(6, minmax(120px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .metric {
    min-height: 82px; padding: 14px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--surface);
  }
  .metric span { color: var(--muted); font-size: 12px; }
  .metric strong { display: block; margin-top: 8px; font-size: 24px; line-height: 1; }
  .metric.alert { border-left: 4px solid var(--red); }
  .metric.pending { border-left: 4px solid #d19a2c; }
  .metric.done { border-left: 4px solid var(--green); }

  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .search-field { position: relative; width: min(360px, 100%); }
  .search-field span { position: absolute; left: 11px; top: 8px; color: #7c8993; font-size: 19px; }
  .search-field input { padding-left: 34px; }
  .toolbar select { width: 210px; }
  .toolbar .button:last-child { margin-left: auto; }

  .table-wrap { overflow: auto; border: 1px solid var(--line); background: #fff; }
  .data-table { width: 100%; border-collapse: collapse; min-width: 980px; }
  .data-table th {
    position: sticky; top: 0; z-index: 1; height: 42px; padding: 9px 12px; color: #4e606d;
    background: #edf2f5; border-bottom: 1px solid var(--line); text-align: left;
    font-size: 12px; font-weight: 700; white-space: nowrap;
  }
  .data-table td { height: 58px; padding: 9px 12px; border-bottom: 1px solid #e5eaee; vertical-align: middle; }
  .data-table tbody tr:hover { background: #f7fafb; }
  .data-table tbody tr.invoice-alert { background: var(--red-soft); box-shadow: inset 4px 0 var(--red); }
  .data-table tbody tr.invoice-alert:hover { background: #ffe7e9; }
  .data-table tbody tr:last-child td { border-bottom: 0; }
  .align-right { text-align: right !important; }
  .job-link { color: var(--blue); font-weight: 750; }
  .cell-sub { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
  .badge {
    display: inline-flex; align-items: center; min-height: 24px; padding: 3px 8px;
    border-radius: 999px; color: #4d5d68; background: #edf1f3; font-size: 11px; font-weight: 700;
  }
  .badge.pending { color: var(--amber); background: var(--amber-soft); }
  .badge.approved, .badge.released { color: var(--green); background: var(--green-soft); }
  .badge.rejected, .badge.alert { color: var(--red); background: #ffe0e3; }
  .empty-state { padding: 60px 20px; color: var(--muted); text-align: center; background: #fff; border: 1px solid var(--line); border-top: 0; }

  .tabs { display: flex; gap: 4px; overflow: auto; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
  .tab-button { min-height: 40px; padding: 8px 12px; border: 0; border-bottom: 3px solid transparent; color: #5f6f7b; background: transparent; white-space: nowrap; }
  .tab-button.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 700; }

  .drawer-backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(12,26,36,.38); }
  .job-drawer {
    position: fixed; z-index: 60; inset: 0 0 0 auto; width: min(660px, 94vw); display: flex;
    flex-direction: column; background: #fff; box-shadow: -14px 0 40px rgba(15,35,49,.22);
    transform: translateX(105%); transition: transform .2s ease;
  }
  .job-drawer.open { transform: translateX(0); }
  .drawer-header { min-height: 74px; display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .drawer-header small { color: var(--muted); font-size: 10px; }
  .drawer-header h2 { margin: 3px 0 0; font-size: 20px; }
  .drawer-header .icon-button { margin-left: auto; }
  .drawer-content { overflow: auto; padding: 18px; }
  .detail-section { padding: 0 0 20px; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
  .detail-section:last-child { border-bottom: 0; }
  .detail-section h3 { margin: 0 0 12px; font-size: 14px; }
  .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 20px; }
  .detail-item span { display: block; color: var(--muted); font-size: 11px; }
  .detail-item strong { display: block; margin-top: 4px; overflow-wrap: anywhere; }
  .action-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .warning-box { padding: 12px; margin-bottom: 16px; color: #7c2229; background: var(--red-soft); border: 1px solid #efb7bc; border-left: 4px solid var(--red); }
  .warning-box strong, .warning-box span { display: block; }
  .warning-box span { margin-top: 5px; font-size: 12px; }
  .file-list { display: grid; gap: 8px; }
  .file-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 10px; background: #f4f7f8; border: 1px solid #e1e7eb; }
  .file-row strong, .file-row span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-row span { margin-top: 3px; color: var(--muted); font-size: 11px; }

  .modal-backdrop { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 20px; background: rgba(12,26,36,.52); }
  .modal { width: min(620px, 100%); max-height: calc(100vh - 40px); overflow: hidden; background: #fff; box-shadow: var(--shadow); }
  .modal-header { height: 58px; display: flex; align-items: center; padding: 0 16px 0 20px; border-bottom: 1px solid var(--line); }
  .modal-header h2 { margin: 0; font-size: 17px; }
  .modal-header .icon-button { margin-left: auto; }
  #modalForm { display: flex; flex-direction: column; max-height: calc(100vh - 98px); }
  .modal-body { overflow: auto; padding: 20px; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; background: #f4f7f8; border-top: 1px solid var(--line); }
  .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
  .field.wide { grid-column: 1 / -1; }
  .checkbox-field { display: flex; align-items: center; gap: 9px; min-height: 40px; }
  .checkbox-field input { width: 18px; min-height: 18px; }
  .inline-note { padding: 10px; color: #6b4a00; background: var(--amber-soft); border: 1px solid #ebd493; font-size: 12px; }

  .toast-region { position: fixed; z-index: 200; right: 18px; bottom: 18px; display: grid; gap: 8px; width: min(360px, calc(100vw - 36px)); }
  .toast { padding: 12px 14px; color: #fff; background: var(--navy); box-shadow: var(--shadow); animation: toastIn .2s ease; }
  .toast.error { background: var(--red); }
  .toast.success { background: var(--green); }
  @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } }

  @media (max-width: 1120px) {
    .metrics { grid-template-columns: repeat(3, minmax(120px, 1fr)); }
  }
  @media (max-width: 760px) {
    .app-shell { display: block; }
    .sidebar { transform: translateX(-105%); transition: transform .2s ease; box-shadow: var(--shadow); }
    .app-shell.menu-open .sidebar { transform: translateX(0); }
    .app-body { width: 100%; }
    .menu-button { display: grid; }
    .topbar { height: 66px; padding: 0 12px; }
    .topbar-actions .button { display: none; }
    .content { padding: 14px 12px 28px; }
    .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .toolbar { align-items: stretch; flex-wrap: wrap; }
    .search-field { width: 100%; }
    .toolbar select { width: calc(55% - 5px); }
    .toolbar .button:last-child { width: calc(45% - 5px); margin-left: 0; }
    .job-drawer { width: 100vw; }
    .detail-grid, .form-grid { grid-template-columns: 1fr; }
    .field.wide { grid-column: auto; }
    .login-panel { padding: 26px 22px; }
  }
</style>
